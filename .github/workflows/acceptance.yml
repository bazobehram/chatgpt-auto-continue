name: Extension Acceptance
on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:
concurrency:
  group: auto-continue-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: python -m pip install -r mission-signal/requirements.txt pytest httpx
      - run: node tests/run-all.cjs
