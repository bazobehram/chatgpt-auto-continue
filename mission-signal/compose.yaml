name: mission-signal
services:
  api:
    build: .
    image: mission-signal:0.1.0
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 192m
    cpus: 0.5
    ports: ["127.0.0.1:18865:8080"]
    volumes:
      - ./data:/data
      - ./secrets/enrollment:/run/secrets/enrollment:ro
    tmpfs: ["/tmp:size=16m,mode=1777"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
  tunnel:
    image: cloudflare/cloudflared:2026.9.3
    command: [tunnel, --no-autoupdate, --config, /etc/cloudflared/config.yml, run]
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.25
    depends_on:
      api: {condition: service_healthy}
    volumes:
      - ./tunnel.yml:/etc/cloudflared/config.yml:ro
      - ./secrets/tunnel.json:/run/secrets/tunnel.json:ro
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
